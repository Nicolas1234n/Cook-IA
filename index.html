
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cook IA</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #131314; color: #e3e3e3; display: flex; }
    
    .sidebar { width: 260px; background: #1e1f20; border-right: 1px solid #2d2d2f; display: flex; flex-direction: column; padding: 12px; transition: transform 0.3s; }
    .sidebar.hidden { transform: translateX(-100%); position: fixed; z-index: 999; height: 100%; }
    .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 998; }
    .sidebar-overlay.active { display: block; }
    .new-chat { background: #1a73e8; color: white; border: none; padding: 10px; border-radius: 24px; cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 8px; justify-content: center; margin-bottom: 12px; }
    .new-chat:hover { background: #1765cc; }
    .projects-btn { background: #2d2d2f; color: #e3e3e3; border: 1px solid #3c4043; padding: 10px; border-radius: 24px; cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 8px; justify-content: center; margin-bottom: 16px; }
    .projects-btn:hover { background: #3c4043; }
    .chat-history { flex: 1; overflow-y: auto; }
    .hist-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hist-item:hover { background: #2d2d2f; }
    
    .projects-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .projects-modal.active { display: flex; }
    .projects-content { background: #1e1f20; border: 1px solid #2d2d2f; border-radius: 16px; width: 90%; max-width: 600px; max-height: 80vh; overflow: hidden; display: flex; flex-direction: column; }
    .projects-header { padding: 20px; border-bottom: 1px solid #2d2d2f; display: flex; align-items: center; justify-content: space-between; }
    .projects-header h2 { font-size: 20px; }
    .close-modal { background: transparent; border: none; color: #9aa0a6; cursor: pointer; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .close-modal:hover { background: #2d2d2f; color: #e3e3e3; }
    .projects-list { padding: 20px; overflow-y: auto; flex: 1; }
    .project-item { background: #131314; border: 1px solid #2d2d2f; border-radius: 12px; padding: 16px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; }
    .project-item:hover { border-color: #8ab4f8; transform: translateY(-2px); }
    .project-title { font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .project-desc { font-size: 13px; color: #9aa0a6; }
    .project-link { color: #8ab4f8; font-size: 12px; margin-top: 8px; display: inline-block; }
    
    .main { flex: 1; display: flex; flex-direction: column; position: relative; }
    .header { padding: 12px 20px; border-bottom: 1px solid #2d2d2f; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .header-left { display: flex; align-items: center; gap: 10px; flex: 1; }
    .menu-btn { background: transparent; border: none; color: #e3e3e3; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: none; align-items: center; justify-content: center; }
    .menu-btn:hover { background: #2d2d2f; }
    .logo-cookie { font-size: 28px; }
    .header-actions { display: flex; gap: 8px; }
    .icon-btn { background: transparent; border: none; color: #e3e3e3; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .icon-btn:hover { background: #2d2d2f; }
    
    .welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; max-width: 768px; margin: 0 auto; padding: 32px 20px; text-align: center; }
    .welcome-cookie { font-size: 72px; margin-bottom: 24px; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .welcome h1 { font-size: 32px; margin-bottom: 16px; background: linear-gradient(90deg, #f59e0b, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .suggestions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; margin-top: 32px; }
    .suggestion { background: #1e1f20; border: 1px solid #2d2d2f; padding: 16px; border-radius: 12px; cursor: pointer; text-align: left; font-size: 14px; }
    .suggestion:hover { background: #2d2d2f; }
    
    .chat { flex: 1; overflow-y: auto; max-width: 768px; margin: 0 auto; padding: 32px 20px; width: 100%; scroll-behavior: smooth; }
    .msg { display: flex; gap: 16px; margin-bottom: 32px; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .user-avatar { background: #2563eb; font-size: 16px; font-weight: 600; }
    .ai-avatar { background: linear-gradient(135deg, #f59e0b, #ec4899); }
    .content-wrap { flex: 1; min-width: 0; }
    .content { line-height: 1.7; word-wrap: break-word; }
    .content p { margin-bottom: 12px; }
    .content pre { background: #0d0d0d; border: 1px solid #2d2d2f; border-radius: 12px; padding: 16px; overflow-x: auto; margin: 16px 0; position: relative; }
    .content code { font-family: 'Consolas', monospace; font-size: 14px; }
    .content :not(pre) > code { background: #2d2d2f; padding: 2px 6px; border-radius: 4px; }
    .copy-code { position: absolute; top: 8px; right: 8px; background: #2d2d2f; border: none; color: #e3e3e3; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .msg-actions { display: flex; gap: 4px; margin-top: 12px; opacity: 0; transition: opacity 0.2s; }
    .msg:hover .msg-actions { opacity: 1; }
    .action-btn { background: transparent; border: 1px solid #2d2d2f; color: #9aa0a6; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; }
    .action-btn:hover { background: #2d2d2f; color: #e3e3e3; }
    
    .input-wrap { padding: 12px 20px 24px; }
    .input-container { max-width: 768px; margin: 0 auto; position: relative; background: #1e1f20; border: 1px solid #2d2d2f; border-radius: 24px; display: flex; align-items: flex-end; padding: 8px 8px 8px 16px; }
    .input-container:focus-within { border-color: #8ab4f8; }
    textarea { flex: 1; background: transparent; border: none; color: #e3e3e3; font-size: 16px; resize: none; outline: none; font-family: inherit; max-height: 200px; padding: 8px 0; }
    .send-btn { width: 36px; height: 36px; background: #8ab4f8; color: #131314; border: none; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .send-btn:disabled { background: #2d2d2f; cursor: not-allowed; }
    .send-btn.stop { background: #ef4444; }
    
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); position: fixed; z-index: 999; height: 100%; }
      .sidebar.active { transform: translateX(0); }
      .menu-btn { display: flex; }
      .suggestions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="sidebar" id="sidebar">
    <button class="new-chat" id="newChatBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      Novo chat
    </button>
    <button class="projects-btn" id="projectsBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      Meus Projetos
    </button>
    <div class="chat-history" id="chatHistory"></div>
  </div>

  <div class="projects-modal" id="projectsModal">
    <div class="projects-content">
      <div class="projects-header">
        <h2>🍪 Projetos do Nicolas</h2>
        <button class="close-modal" id="closeModal">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="projects-list" id="projectsList"></div>
    </div>
  </div>

  <div class="main">
    <div class="header">
      <div class="header-left">
        <button class="menu-btn" id="menuBtn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="logo-cookie">🍪</div>
        <div style="font-weight: 600; font-size: 18px;">Cook IA</div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="projectsBtnMobile" title="Meus Projetos">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </button>
        <button class="icon-btn" id="shareBtn" title="Compartilhar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
        </button>
        <button class="icon-btn" id="clearBtn" title="Limpar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
    </div>

    <div class="chat" id="chat">
      <div class="welcome" id="welcome">
        <div class="welcome-cookie">🍪</div>
        <h1>Como posso ajudar hoje?</h1>
        <div class="suggestions">
          <div class="suggestion" data-prompt="Me explica como funciona uma API REST">🔧 Me explica como funciona uma API REST</div>
          <div class="suggestion" data-prompt="Cria um código Python para web scraping">💻 Cria um código Python para web scraping</div>
          <div class="suggestion" data-prompt="Quais são as melhores práticas de React?">⚛️ Melhores práticas de React</div>
          <div class="suggestion" data-prompt="Me ajuda a debugar esse erro de JavaScript">🐛 Ajuda a debugar erro de JS</div>
        </div>
      </div>
    </div>

    <div class="input-wrap">
      <div class="input-container">
        <textarea id="input" rows="1" placeholder="Mensagem para Cook IA"></textarea>
        <button class="send-btn" id="sendBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </div>

<script>
// ===== CONFIGURA AQUI =====
const API_KEY = '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';
const API_URL = 'https://api.groq.com/openai/v1/chat/completions';
const MODEL = 'llama-3.3-70b-versatile';
const TEMPERATURE = 0.7;
const MAX_TOKENS = 4096;

const MEUS_PROJETOS = [
  {
    title: 'Codex RPG Offline',
    desc: 'Gerenciador de fichas + IA Mestre pra mesa',
    url: 'https://codepen.io/Nicolas-john-said-laureano/embed/WbooXem?default-tab=result&theme-id=dark',
    icon: '🎲'
  },
  {
    title: 'Cook IA',
    desc: 'Assistente com streaming e highlight',
    url: 'https://codepen.io/Nicolas-john-said-laureano/embed/RNooegK?default-tab=result&theme-id=dark',
    icon: '🍪'
  }
];

const SYSTEM_PROMPT = `Você é Cook IA, uma IA criada por Nicolas john, um developer de nível intermediário. A ideia e desenvolvimento principal foram todos dele. Ele teve um pouco de ajuda da Meta AI para usar o modelo base, mas o projeto, interface e conceito são 100% do Nicolas john. 

Quando perguntarem "por quem você foi criado", "quem te fez", "quem é seu criador" ou similar, responda: "Fui criado pelo Nicolas john, um developer de nível intermediário. Ele teve um pouco de ajuda da Meta AI pra usar o modelo base, mas a ideia, interface e todo o projeto Cook IA foram feitos por ele."

Seja direto, técnico e útil nas outras respostas. Use markdown pra formatar código.`;
// ==========================

const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const chat = document.getElementById('chat');
const welcome = document.getElementById('welcome');
const newChatBtn = document.getElementById('newChatBtn');
const clearBtn = document.getElementById('clearBtn');
const shareBtn = document.getElementById('shareBtn');
const projectsBtn = document.getElementById('projectsBtn');
const projectsBtnMobile = document.getElementById('projectsBtnMobile');
const projectsModal = document.getElementById('projectsModal');
const closeModal = document.getElementById('closeModal');
const projectsList = document.getElementById('projectsList');
const menuBtn = document.getElementById('menuBtn');
const sidebar = document.getElementById('sidebar');
const sidebarOverlay = document.getElementById('sidebarOverlay');
let hist = [];
let controller = null;
let isGenerating = false;

marked.setOptions({
  highlight: code => hljs.highlightAuto(code).value,
  breaks: true
});

function loadProjects() {
  projectsList.innerHTML = MEUS_PROJETOS.map(p => `
    <div class="project-item" onclick="window.open('${p.url}', '_blank')">
      <div class="project-title">${p.icon} ${p.title}</div>
      <div class="project-desc">${p.desc}</div>
      <div class="project-link">Abrir projeto →</div>
    </div>
  `).join('');
}
loadProjects();

menuBtn.onclick = () => {
  sidebar.classList.add('active');
  sidebarOverlay.classList.add('active');
};

sidebarOverlay.onclick = () => {
  sidebar.classList.remove('active');
  sidebarOverlay.classList.remove('active');
};

projectsBtn.onclick = projectsBtnMobile.onclick = () => projectsModal.classList.add('active');
closeModal.onclick = () => projectsModal.classList.remove('active');
projectsModal.onclick = (e) => { if (e.target === projectsModal) projectsModal.classList.remove('active'); };

document.querySelectorAll('.suggestion').forEach(s => {
  s.onclick = () => {
    input.value = s.dataset.prompt;
    sendMsg();
  };
});

function hideWelcome() {
  if (welcome) welcome.style.display = 'none';
}

function renderMsg(text, isUser) {
  hideWelcome();
  const d = document.createElement('div');
  d.className = 'msg';
  
  d.innerHTML = `
    <div class="avatar ${isUser ? 'user-avatar' : 'ai-avatar'}">${isUser ? 'M' : '🍪'}</div>
    <div class="content-wrap">
      <div class="content">${isUser ? text : marked.parse(text)}</div>
      ${!isUser ? `
        <div class="msg-actions">
          <button class="action-btn copy-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copiar
          </button>
          <button class="action-btn regen-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 9-9 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
            Regenerar
          </button>
        </div>
      ` : ''}
    </div>
  `;
  
  chat.appendChild(d);
  
  d.querySelectorAll('pre').forEach(pre => {
    const btn = document.createElement('button');
    btn.className = 'copy-code';
    btn.textContent = 'Copiar código';
    btn.onclick = () => {
      navigator.clipboard.writeText(pre.querySelector('code').textContent);
      btn.textContent = 'Copiado!';
      setTimeout(() => btn.textContent = 'Copiar código', 2000);
    };
    pre.appendChild(btn);
  });
  
  d.querySelector('.copy-btn')?.addEventListener('click', () => {
    navigator.clipboard.writeText(text);
  });
  
  d.querySelector('.regen-btn')?.addEventListener('click', () => regenerate());
  
  chat.scrollTop = chat.scrollHeight;
  return d.querySelector('.content');
}

async function regenerate() {
  if (isGenerating || hist.length < 2) return;
  hist.pop();
  chat.lastElementChild.remove();
  await sendMsg(hist[hist.length - 1].content, true);
}

async function sendMsg(forcedText = null, isRegen = false) {
  const t = forcedText || input.value.trim();
  if (!t || isGenerating) return;
  if (API_KEY === 'COLA_TUA_KEY_AQUI') {
    renderMsg('**Erro**: Cola tua key da Groq na linha 47 do código', false);
    return;
  }
  
  if (!isRegen) {
    renderMsg(t, true);
    hist.push({ role: 'user', content: t });
  }
  
  input.value = '';
  input.style.height = 'auto';
  isGenerating = true;
  sendBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12"/></svg>';
  sendBtn.classList.add('stop');
  
  const contentEl = renderMsg('', false);
  let full = '';
  controller = new AbortController();
  
  try {
    const r = await fetch(API_URL, {
      method: 'POST',
      signal: controller.signal,
      headers: { 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: MODEL,
        messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...hist],
        temperature: TEMPERATURE,
        max_tokens: MAX_TOKENS,
        stream: true
      })
    });

    if (!r.ok) throw new Error(`${r.status}: ${(await r.json()).error?.message || 'Erro'}`);

    const reader = r.body.getReader();
    const dec = new TextDecoder();
    
    while (1) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = dec.decode(value);
      for (const line of chunk.split('\n')) {
        if (line.startsWith('data: ')) {
          const data = line.slice(6);
          if (data === '[DONE]') continue;
          try {
            const token = JSON.parse(data).choices[0]?.delta?.content || '';
            full += token;
            contentEl.innerHTML = marked.parse(full);
            chat.scrollTop = chat.scrollHeight;
          } catch {}
        }
      }
    }
    
    hist.push({ role: 'assistant', content: full });
    hljs.highlightAll();
  } catch (e) {
    contentEl.innerHTML = e.name === 'AbortError' ? '*Interrompido*' : `**Erro**: ${e.message}`;
  } finally {
    isGenerating = false;
    sendBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>';
    sendBtn.classList.remove('stop');
    controller = null;
  }
}

sendBtn.onclick = () => isGenerating ? controller?.abort() : sendMsg();
input.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }};
input.oninput = () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 200) + 'px'; };
newChatBtn.onclick = clearBtn.onclick = () => { hist = []; chat.innerHTML = ''; chat.appendChild(welcome); welcome.style.display = 'flex'; sidebar.classList.remove('active'); sidebarOverlay.classList.remove('active'); };
shareBtn.onclick = () => { navigator.clipboard.writeText(window.location.href); alert('Link copiado!'); };
</script>
</body>
</html>
